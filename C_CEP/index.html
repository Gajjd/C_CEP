<!DOCTYPE html>
<html lang="pt-br">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Consultador de CEPs</title>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>

        <main class="container">
            <h1>Consultador de CEPs</h1>
            <p class="subtitulo">Consulte endereços de todo o Brasil usando a
                API gratuita do ViaCEP.</p>

            <!-- Formulário de Busca-->
            <div class="busca-box">
                <p>Digite o CEP:</p>
                <input type="text" id="cep"
                    placeholder="Digite o CEP (ex:01001-000)" maxlength="9">
                <button id="btnBuscar">Buscar</button>
            </div>

            <!--Mensagens-->
            <div id="mensagem" class="mensagem oculto"></div>

            <!-- Resultado da Consulta-->
            <div id="resultado" class="resultado oculto">
                <p><strong>Logradouro (Rua):</strong> <span id="logradouro">-</span></p>
                <p><strong>Bairro:</strong> <span id="bairro">-</span></p>
                <p><strong>Cidade:</strong> <span id="cidade">-</span></p>
                <p><strong>Estado (UF):</strong> <span id="uf">-</span></p>
                <p><strong>DDD:</strong> <span id="ddd">-</span></p>

                <footer>
                    Documentação Oficial: <a href="http://viacep.com.br/" target="_blank" rel="noopener noreferrer">ViaCep WebService</a>
                </footer>

            </div>
        </main>

        <script src="script.js"></script>

    </body>
</html>
